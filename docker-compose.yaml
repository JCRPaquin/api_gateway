version: '3.8'
services:
  apigateway:
    build: .
    command: >-
      sh -c "alembic upgrade head && exec gunicorn --bind=0.0.0.0:8181
      --access-logfile=- --error-logfile=- wsgi:application"
    environment:
      OTEL_SERVICE_NAME: api-gateway
      ENABLE_OTEL: 'EXPORTER'
    read_only: true
    tmpfs:
      - /tmp
      - /app/apigateway/logs:uid=10001,gid=10001,mode=0755
    ports:
      - "5000:8181"
    depends_on:
      - db
      - redis
  db:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/db:/var/lib/postgresql/data
  redis:
    image: redis:8.2.9-bookworm@sha256:66b7f4c2f3c6ef1b298bbd7b13c806bc6f71e61f1136a4f58710daf2cb053b21
    environment:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    ports:
      - "6379:6379"
