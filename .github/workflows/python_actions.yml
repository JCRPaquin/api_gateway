name: Python CI actions

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PGDATABASE: gateway
  PGPASSWORD: ci-database-password-32-bytes
  PGUSER: user
  PGHOST: postgres
  PGPORT: 5432
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: gateway
  DATABASE_USER: user
  DATABASE_PASSWORD: ci-database-password-32-bytes
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_USER: gateway_ci
  REDIS_PASSWORD: ci-redis-password-32-bytes
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.15-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70

    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: gateway
          POSTGRES_PASSWORD: ci-database-password-32-bytes
          POSTGRES_USER: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.2.9-bookworm@sha256:66b7f4c2f3c6ef1b298bbd7b13c806bc6f71e61f1136a4f58710daf2cb053b21
        env:
          REDIS_USER: gateway_ci
          REDIS_PASSWORD: ci-redis-password-32-bytes
        ports:
          - 6379:6379
        options: >-
          --health-cmd "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli
          --no-auth-warning --user $REDIS_USER ping || redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Verify installed dependency compatibility
        run: uv pip check --python .venv/bin/python

      - name: Configure authenticated Redis
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import os

          import redis

          host = os.environ["REDIS_HOST"]
          port = int(os.environ["REDIS_PORT"])
          username = os.environ["REDIS_USER"]
          password = os.environ["REDIS_PASSWORD"]
          admin = redis.Redis(host=host, port=port)
          admin.execute_command(
              "ACL",
              "SETUSER",
              username,
              "reset",
              "on",
              f">{password}",
              "resetkeys",
              "resetchannels",
              "~gateway:storage:v1:*",
              "~gateway:cache:v1:*",
              "~LIMITS:*",
              "-@all",
              "+ping",
              "+select",
              "+get",
              "+mget",
              "+set",
              "+setex",
              "+psetex",
              "+del",
              "+unlink",
              "+exists",
              "+incr",
              "+incrby",
              "+incrbyfloat",
              "+expire",
              "+pexpire",
              "+persist",
              "+ttl",
              "+pttl",
              "+keys",
              "+scan",
              "+multi",
              "+exec",
              "+discard",
              "+evalsha",
              "+script|load",
          )
          admin.execute_command("ACL", "SETUSER", "default", "off")
          authenticated = redis.Redis(
              host=host,
              port=port,
              username=username,
              password=password,
          )
          if not authenticated.ping():
              raise RuntimeError("Authenticated Redis health check failed")
          PY

      - name: Initialize postgres
        run: uv run --frozen --extra dev alembic upgrade head

      - name: Test with pytest
        run: uv run --frozen --extra dev pytest

      - name: Upload trusted push coverage to Coveralls
        if: >-
          github.event_name == 'push' &&
          github.repository == 'adsabs/api_gateway' &&
          github.ref == 'refs/heads/main'
        run: uv run --frozen --extra dev coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
